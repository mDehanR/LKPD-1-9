<!--Jelaskan perbedaan antara if dan else if-->
<!--Perbedaan utama adalah if hanya mengeksekusi blok kodenya jika kondisinya benar,
 sedangkan else if digunakan untuk mengecek kondisi tambahan setelah if pertama tidak terpenuhi.
 else if (atau elif) hanya akan dievaluasi dan dieksekusi jika kondisi if sebelumnya salah dan
 kondisi else if itu sendiri benar, dan ia membantu menghemat pemrosesan karena hanya
 mengeksekusi satu cabang dari semua kemungkinan. -->

<!--Apa yang terjadi bila semua kondisi salah?-->
<!--Jika semua kondisi dalam rangkaian if dan else if bernilai salah, maka tidak ada blok kode
 di dalam if atau else if yang akan dijalankan. Program akan melanjutkan eksekusi ke baris kode
 setelah seluruh struktur if-else if selesai.-->
<body>
    <script>
       document.write ("Muhamad Dehan Roziku X PPLG 2");
       let nilai = prompt("Masukkan nilai:");
       nilai = Number(nilai);
       if (nilai >= 70) {
        alert("Lulus");
       } else {
        alert("Belum Lulus")
       }
    </script>
</body>
