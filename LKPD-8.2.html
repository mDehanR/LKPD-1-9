<!DOCTYPE html>

<h1>LKPD 8</h1>
<!--Refleksi-->

<!--Apa perbedaan onclick dan onmouseover?-->
<!--Perbedaan utama onclick dan onmouseover adalah pada jenis interaksinya: onclick merespons saat
 pengguna mengklik elemen, sedangkan onmouseover merespons saat kursor mouse diarahkan ke atas
 elemen. onclick digunakan untuk tindakan permanen seperti mengirim formulir atau mengubah konten,
 sementara onmouseover sering digunakan untuk efek visual seperti mengubah warna atau menampilkan
 tooltip.-->

<!--Mengapa event penting untuk interaktivitas?-->
<!--Event penting untuk interaktivitas karena memungkinkan peserta untuk terlibat secara aktif
 sehingga menciptakan pengalaman yang lebih personal, dinamis, dan mudah diingat.-->
<body>
    <h3>Form Pendaftaran Sederhana</h3>

<input type="text" id="nama" placeholder="Nama Lengkap"><br><br>
<input type="email" id="email" placeholder="Email"><br><br>
<input type="password" id="password" placeholder="Kata sandi"><br><br>

<button onclick="validasi()">Daftar</button>

<p id="pesan"></p>

<script>
function validasi() {
    let nama = document.getElementById("nama").value;
    let email = document.getElementById("email").value;
    let pass = document.getElementById("password").value;
    let pesan = document.getElementById("pesan");

    if (nama === "" || email === "" || pass === "") {
        pesan.innerHTML = "❌ Semua kolom wajib diisi!";
        pesan.style.color = "red";
    }
    else if (pass.length < 8) {
        pesan.innerHTML = "❌ Password harus minimal 8 karakter!";
        pesan.style.color = "red";
    }
    else if (!email.includes("@")) {
        pesan.innerHTML = "❌ Email tidak valid!";
        pesan.style.color = "red";
    }
    else {
        pesan.innerHTML = "✅ Pendaftaran berhasil!";
        pesan.style.color = "green";
    }
}
</script>
    </script>
</body>
</html>
