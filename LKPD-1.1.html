<!--Apa itu variabel dan mengapa penting?-->
<!--Variabel adalah elemen atau faktor yang dapat berubah-ubah dan digunakan untuk menyimpan nilai,
 baik dalam komputasi (penyimpanan data) maupun penelitian (aspek yang diukur atau dimanipulasi).
 Variabel penting karena memungkinkan kita untuk menyimpan, mengelola, dan memanipulasi informasi dalam
 program atau menganalisis hubungan antar faktor dalam suatu studi, yang tanpa variabel, sebagian besar
 komputasi modern dan penelitian ilmiah tidak akan mungkin dilakukan.-->
