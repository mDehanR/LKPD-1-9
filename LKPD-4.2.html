<!--Refleksi-->

<!--Mengapa fungsi membuat kode lebih efisien?-->
<!--Fungsi membuat kode lebih efisien karena mengurangi pengulangan kode, meningkatkan keterbacaan
 dan pemeliharaan, serta mempermudah pengujian dan debugging. Dengan membungkus serangkaian
 instruksi ke dalam satu fungsi, Anda dapat memanggil fungsi tersebut berkali-kali tanpa perlu
 menulis ulang kode yang sama, sehingga kode lebih ringkas, terorganisir, dan lebih mudah dipahami.-->

<!--Apa perbedaan antara parameter dan return?-->
<!--Parameter adalah variabel input yang diteruskan ke fungsi saat dipanggil, sedangkan return
 adalah pernyataan yang mengirimkan nilai keluar dari fungsi setelah selesai dieksekusi. Parameter
 menyediakan data untuk diproses di dalam fungsi, sedangkan return memberikan hasil atau nilai yang
 dihasilkan oleh fungsi tersebut.-->
<body>
    <script>
       document.write ("Muhamad Dehan Roziku X PPLG 2");
       function sapa(nama) {
        console.log("Halo, " + nama + "! Selamat datang !")
       }
    </script>
</body>
