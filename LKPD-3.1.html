<!--Kapan lebih cocok menggunakan for daripada while?-->
<!--Menggunakan perulangan for lebih cocok ketika jumlah iterasi (pengulangan) sudah diketahui
 secara pasti sebelum perulangan dimulai. Sebaliknya, while lebih cocok digunakan ketika jumlah
 iterasi tidak diketahui dan perulangan berlangsung selama suatu kondisi tertentu bernilai benar.-->

<!--Apa manfaat perulangan dibanding menulis perintah berulang kali?-->
<!--Manfaat utama menggunakan perulangan adalah efisiensi kode, karena Anda tidak perlu menulis
 perintah yang sama berulang kali. Ini membuat program lebih singkat, mudah dibaca, dan mengurangi
 potensi kesalahan penulisan. Selain itu, perulangan memungkinkan program untuk menangani tugas
 berulang dengan cepat dan fleksibel, seperti memproses banyak data atau menjalankan aksi selama
 kondisi tertentu terpenuhi.-->
<body>
    <script>
       document.write ("Muhamad Dehan Roziku X PPLG 2");
       let jumlah = 0;
       for (let i = 1; i <= 10; i++) {
        jumlah += i;
       }
       console.log("jumlah angka 1 sampai 10 adalah:", jumlah);
    </script>
</body>
